    (function () {

      function configureSentry() {
        try {
          if (!window.Sentry) return;
          if (typeof window.Sentry.onLoad === "function") {
            window.Sentry.onLoad(initSentry);
          } else {
            initSentry();
          }
        } catch (error) { /* CDN unavailable or blocked. */ }
      }

      if (document.readyState === "complete") {
        configureSentry();
      } else {
        window.addEventListener("load", configureSentry, { once: true });
      }
    })();

    function track(action) {
      try {
        if (window.Sentry && typeof window.Sentry.addBreadcrumb === "function") {
          window.Sentry.addBreadcrumb({ category: "ui", message: action, level: "info" });
        }
      } catch (error) { /* Tracking is non-blocking. */ }
    }

    document.addEventListener("click", function (event) {
      if (!(event.target instanceof Element)) return;
      var target = event.target.closest("a, button, [role='button']");
      if (!target) return;
      var action = target.getAttribute("data-sentry-action");
      if (action) track(action);
    }, true);
  </script>
